name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @theg1team/mcp-ads-client typecheck
      - run: pnpm lint
      - run: pnpm --filter @theg1team/mcp-ads-client test
      - run: pnpm --filter @theg1team/mcp-ads-client build
